name: deploy

# Deploy main to the AWS server (site + /inha portal + workspace) on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::509614632997:role/unai-github-deploy
          aws-region: ap-southeast-2
      - name: Deploy on the server (SSM)
        env:
          INSTANCE: i-080bf3ac86470e88e
          APP: site
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name UNAI-Deploy \
            --parameters "App=$APP" --comment "deploy $APP ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          for _ in $(seq 1 200); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = Success ]
